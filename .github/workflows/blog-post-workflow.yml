# yamllint disable-line rule:document-start
name: Add Latest Blog Posts

on:
  schedule:
    - cron: 0 0 * * * # every day at midnight
  workflow_dispatch: # Run workflow manually directly via the Github Actions Workflow page.

concurrency:
  group: blog-post
  cancel-in-progress: true

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: "https://proinsias.github.io/feed.xml"
