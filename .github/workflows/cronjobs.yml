# yamllint disable-line rule:document-start
name: Cron Jobs

######################################################################
## minute         0-59
## hour           0-23
## day of month   1-31
## month          1-12
## day of week    0-7
######################################################################

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: 0 0 * * 1 # every Monday at midnight
  # Run workflow manually (without waiting for the cron to be called),
  # through the Github Actions Workflow page directly.
  workflow_dispatch:

jobs:
  cronjobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # required for peter-evans/create-issue-from-file

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "'https://raw.githubusercontent.com/proinsias/proinsias/refs/heads/main/README.md'"
          fail: false

      - name: Create Issue From File
        if:
          steps.lychee.outputs.exit_code != 0 && hashFiles('./lychee/out.md') !=
          ''
        continue-on-error: true
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
